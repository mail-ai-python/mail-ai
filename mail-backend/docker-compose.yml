services:
  # 1. Auth Service (API)
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/DockerFile
    ports:
      # Use 8000 as a default if the variables are not in the .env file
      - "${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PORT=8000
    volumes:
      - .:/app

  # 2. Event Processor (Webhook)
  event-processor:
    build:
      context: .
      dockerfile: services/event_processor/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
